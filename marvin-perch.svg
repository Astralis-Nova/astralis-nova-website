<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" fill="none">
  <title>Marvin the Martian with his ray gun on the Nova sphere</title>
  <!-- Movement study: user-supplied Oct 14 clips (head turn and costumed full-body gesture). -->
  <!-- Design reference: https://chuckjones.com/characters/marvin-the-martian/ -->
  <defs>
    <linearGradient id="marvinHelmet" x1="77" y1="58" x2="165" y2="130" gradientUnits="userSpaceOnUse"><stop stop-color="#91d85a"/><stop offset=".48" stop-color="#4fa244"/><stop offset="1" stop-color="#23703b"/></linearGradient>
    <linearGradient id="marvinRed" x1="97" y1="171" x2="145" y2="231" gradientUnits="userSpaceOnUse"><stop stop-color="#f94e4a"/><stop offset="1" stop-color="#bb253a"/></linearGradient>
    <linearGradient id="marvinShoe" x1="100" y1="272" x2="112" y2="302" gradientUnits="userSpaceOnUse"><stop stop-color="#fffef5"/><stop offset="1" stop-color="#cbd6da"/></linearGradient>
    <radialGradient id="marvinFace" cx="35%" cy="30%" r="75%"><stop stop-color="#262735"/><stop offset=".55" stop-color="#12131d"/><stop offset="1" stop-color="#03050c"/></radialGradient>
    <linearGradient id="marvinGun" x1="185" y1="141" x2="192" y2="176" gradientUnits="userSpaceOnUse"><stop stop-color="#ffef9c"/><stop offset=".3" stop-color="#e2b746"/><stop offset=".65" stop-color="#a77b2c"/><stop offset="1" stop-color="#684c25"/></linearGradient>
    <linearGradient id="marvinBarrel" x1="216" y1="143" x2="216" y2="169" gradientUnits="userSpaceOnUse"><stop stop-color="#d6f0de"/><stop offset=".35" stop-color="#6ea389"/><stop offset="1" stop-color="#234f48"/></linearGradient>
    <radialGradient id="marvinCharge"><stop stop-color="#faffd6"/><stop offset=".3" stop-color="#afff91" stop-opacity=".8"/><stop offset="1" stop-color="#53e6c0" stop-opacity="0"/></radialGradient>
    <clipPath id="marvinEyeClip">
      <path d="M89 106c8-8 22-8 29 0 4 21 2 36-7 38-10 0-19-18-22-38Z"/>
      <path d="M126 106c9-9 24-8 31-1-1 23-9 39-19 38-9-1-12-18-12-37Z"/>
    </clipPath>
  </defs>
  <ellipse cx="123" cy="306" rx="67" ry="5" fill="#041323" opacity=".4"/>
  <g stroke="#202335" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Knee joints flex between the moving hips and fixed shoe contacts. -->
    <path class="marvin-left-leg-outline" d="M102 236L98.17200161864497 250.62739991906778Q96.68333558145135 256.31583322092746 98.73200161864497 261.8273999190678L104 276" stroke="#202335" stroke-width="17"/>
    <path class="marvin-left-leg" d="M102 236L98.17200161864497 250.62739991906778Q96.68333558145135 256.31583322092746 98.73200161864497 261.8273999190678L104 276" stroke="#df3543" stroke-width="11"/>
    <path class="marvin-right-leg-outline" d="M145 236L151.0115621074152 249.8735547365731Q153.34939181585443 255.2688260230182 152.4115621074152 261.0735547365731L150 276" stroke="#202335" stroke-width="17"/>
    <path class="marvin-right-leg" d="M145 236L151.0115621074152 249.8735547365731Q153.34939181585443 255.2688260230182 152.4115621074152 261.0735547365731L150 276" stroke="#ed414a" stroke-width="11"/>
    <g class="marvin-shoes">
      <path d="M87 268c-3 9-7 11-17 14-13 4-21 9-20 16 0 8 31 8 58 6 14-1 19-6 14-14l-8-23Z" fill="url(#marvinShoe)"/>
      <path d="M52 297c17 4 44 4 70-2l1 6c-20 8-57 9-71 3Z" fill="#e44848" stroke-width="2.3"/>
      <path d="M139 268c-5 9-5 20-1 29 6 8 40 9 60 6 15-2 14-10 2-17-10-6-21-7-28-18Z" fill="url(#marvinShoe)"/>
      <path d="M138 296c20 5 45 6 66-1l1 7c-19 8-53 7-66 0Z" fill="#e44848" stroke-width="2.3"/>
      <path d="m89 274 21 1m-24 6 23 1m-27 6 24 1m40-13 20-1m-18 8 23-1m-21 8 24-1" stroke="#969da9" stroke-width="2"/>
      <path d="M64 289c9-5 14-6 21-5m94 1c6 1 11 3 15 6" stroke="#fff" stroke-width="2.6"/>
    </g>
    <g class="marvin-balance">
      <path d="M102 168c-8 13-10 34-8 52l56 1c2-20-1-40-11-52" fill="url(#marvinRed)"/>
      <path class="marvin-free-arm-outline" d="M103 184L82.15074449444194 182.86732843950395Q74.04270068672491 182.4268450548666 75.43074449444194 190.42732843950395L79 211" stroke="#202335" stroke-width="19"/>
      <path class="marvin-free-arm" d="M103 184L82.15074449444194 182.86732843950395Q74.04270068672491 182.4268450548666 75.43074449444194 190.42732843950395L79 211" stroke="url(#marvinRed)" stroke-width="13"/>
      <g class="marvin-free-hand" transform="translate(79 211)">
        <path class="marvin-fist" d="M-8 0c-8-2-11-8-7-12 1-5 6-6 10-3 4-5 10-3 10 2 7 0 9 8 4 12-4 6-12 6-17 1Z" fill="url(#marvinShoe)"/>
        <g class="marvin-fist-lines" stroke-width="1.7"><path d="m-10-9 11 4m-12 1 10 4"/></g>
        <g class="marvin-open-hand" opacity="0">
          <path d="M-8 0c-4-3-8-9-6-12 2-3 5 0 7 2l-3-13c-1-4 4-5 5-1l3 10-1-16c0-4 6-4 6 0l1 15 3-12c1-4 6-2 5 2l-3 16c6-3 10 0 7 4-5 7-13 10-20 5Z" fill="url(#marvinShoe)"/>
          <path d="M-5-8q6-3 12 1m-5-2L3-1" stroke-width="1.6"/>
        </g>
        <path d="m-9 0 18 1-1 8-16-1Z" fill="#63b554" stroke-width="2.4"/>
      </g>
      <!-- Shoulder, sleeve, gripping glove and ray gun share one pivot. -->
      <g class="marvin-gun-arm" transform="rotate(13 145 183)">
        <path d="M143 178c15 3 23 14 30 21l9-25 16 5c-4 17-8 34-20 37-16 4-32-12-39-23" fill="url(#marvinRed)"/>
        <path d="m178 177 21 6-3 11-22-7Z" fill="#5da94f" stroke-width="2.6"/>
        <g class="marvin-ray-gun">
          <path d="m181 162 17 4-5 24-14-2Z" fill="#456a45"/>
          <path d="M197 169q16 0 10 13-4 6-12 0" stroke="#c7ae64" stroke-width="3"/>
          <path d="M165 150q5-13 22-12l23 5 10 7-2 16-27 7-22-7Z" fill="url(#marvinGun)"/>
          <path d="m178 141 8-12 13 1 1 12" fill="#5e9954" stroke-width="2.4"/>
          <path d="m166 153-8-3-3 10 12 3" fill="#8eac74" stroke-width="2.4"/>
          <ellipse cx="189" cy="154" rx="8" ry="9" fill="#507e55" stroke-width="2.3"/>
          <ellipse cx="189" cy="152" rx="3" ry="4" fill="#c2ec96" stroke="none"/>
          <path d="m204 147 30 1 6 8-6 8-30 1Z" fill="url(#marvinBarrel)"/>
          <ellipse cx="210" cy="156" rx="4" ry="13" fill="#82ac87" stroke-width="2.4"/>
          <ellipse cx="219" cy="156" rx="4" ry="12" fill="#a6c9a1" stroke-width="2.4"/>
          <ellipse cx="229" cy="156" rx="4" ry="10" fill="#d0dfb2" stroke-width="2.4"/>
          <ellipse cx="239" cy="156" rx="4.5" ry="7" fill="#183c39" stroke-width="2.3"/>
          <path d="m174 146 9-2m20 2 5 2m4 0v5m9-4v5" stroke="#fff4c1" stroke-width="1.8"/>
          <path d="M179 177c-5-6-11-2-9 4-4 4-1 10 4 12 9 7 20 3 23-4l2-12c-1-5-7-5-10-1-3-5-8-3-10 1Z" fill="url(#marvinShoe)"/>
          <path d="m179 181 11 3m-13 3 12 3m4-14-1 6" stroke-width="1.8"/>
          <!-- Restrained glow and short moving energy rings, away from the planet. -->
          <g class="marvin-gun-light" stroke="none" opacity="0">
            <ellipse cx="238" cy="156" rx="26" ry="24" fill="url(#marvinCharge)"/>
            <ellipse cx="240" cy="156" rx="3" ry="5" fill="#e8ffbc"/>
            <path d="m222 167 14-2-6 4-10 1Z" fill="#d6ffb5" opacity=".7"/>
          </g>
          <g class="marvin-laser" opacity="0" pointer-events="none">
            <path d="M243 156h45" stroke="#63f9c1" stroke-width="7" opacity=".38"/>
            <path d="M243 156h45" stroke="#ecffca" stroke-width="2.4"/>
            <g class="marvin-laser-rings" stroke="#b9ffbe" stroke-width="2.5">
              <ellipse cx="251" cy="156" rx="3" ry="8"/><ellipse cx="263" cy="156" rx="3.5" ry="10"/>
            </g>
          </g>
        </g>
      </g>
      <!-- Roman skirt with distinct pleats and a sturdy red belt. -->
      <path d="m98 213-20 30 21 5 12-5 12 7 13-7 13 5 23-6-23-29Z" fill="url(#marvinHelmet)"/>
      <path d="m105 219-7 26m18-25-5 23m15-22-3 25m13-27 2 23m6-24 9 26" stroke="#27723b" stroke-width="2.5"/>
      <path d="m98 211 51 1 1 9-54-1Z" fill="#e44540" stroke-width="2.6"/>
      <g class="marvin-head">
        <path d="M73 115c-2-33 20-55 49-55 31 0 54 22 55 53 1 29-17 57-47 61-30 3-54-25-57-59Z" fill="url(#marvinFace)"/>
        <g class="marvin-face-features">
        <g class="marvin-eyes">
          <path d="M89 106c8-8 22-8 29 0 4 21 2 36-7 38-10 0-19-18-22-38Z" fill="#fffdf5" stroke-width="1.8"/>
          <path d="M126 106c9-9 24-8 31-1-1 23-9 39-19 38-9-1-12-18-12-37Z" fill="#fffdf5" stroke-width="1.8"/>
          <g clip-path="url(#marvinEyeClip)"><g class="marvin-pupils" fill="#15151f" stroke="none"><ellipse cx="109" cy="129" rx="4.2" ry="9"/><ellipse cx="140" cy="129" rx="4.2" ry="9"/></g></g>
          <path class="marvin-left-lid" d="M87 99H121V111L87 106Z" fill="url(#marvinFace)" stroke="none"/>
          <path class="marvin-right-lid" d="M123 99H160V106L123 111Z" fill="url(#marvinFace)" stroke="none"/>
        </g>
        </g>
        <!-- Cheek guards frame the black face without inventing a mouth. -->
        <path d="M75 98c-7 16-7 40 3 55l14 4-5-45Z" fill="#377e3d"/>
        <path d="M156 106c3 15 0 33-8 45l16-3c11-13 13-31 9-48Z" fill="#2c713b"/>
        <path d="M62 104c1-36 22-58 57-58 34 0 57 21 62 55l-20 7-76 4Z" fill="url(#marvinHelmet)"/>
        <path d="M82 73c12-16 35-20 52-16" stroke="#b9ed87" stroke-width="3"/>
        <path d="M89 67c11-8 27-11 38-8" stroke="#e3ffc2" stroke-width="2" opacity=".65"/>
        <path d="M158 68c10 9 16 20 18 31" stroke="#184e33" stroke-width="3" opacity=".5"/>
        <path d="M55 103c28-14 85-14 128-3l4 13c-47-9-92-7-130 4Z" fill="#63b54d"/>
        <path d="M61 107c30-9 82-11 116-3" stroke="#a0dc71" stroke-width="2.2"/>
        <g class="marvin-plume">
          <path d="m113 49 1-20 13-1 4 22Z" fill="#947044"/>
          <path d="M87 16c20-8 45-6 65 2l-3 22c-19-5-39-5-60 1Z" fill="#e4b942"/>
          <path d="M87 16c22-8 47-6 65 2" stroke="#ffe585" stroke-width="3"/>
          <path d="m94 19 1 18m7-20 1 18m7-19 1 18m7-18 1 18m7-17 1 18m7-16 1 17m7-15 1 16" stroke="#b78a2f" stroke-width="1.7"/>
        </g>
      </g>
    </g>
  </g>
</svg>
