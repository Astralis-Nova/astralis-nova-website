function startVoice(){

 if(!SpeechAPI){setNexusStatus('VOICE UNSUPPORTED • USE MENU');return;}
 try{
 const rec=new SpeechAPI();recognition=rec;rec.lang='en-US';rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=3;

}

let captureLibrary;
function getCaptureLibrary(){
 if(!captureLibrary) captureLibrary=import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.esm.js')
 .then(module=>module.default).catch(error=>{captureLibrary=null;throw error});
 return captureLibrary;
}
function closePage(){

 pageFrame?.remove();pageFrame=null;

 pageTexture?.dispose();pageTexture=null;

async function renderPage(){
 if(!pageFrame||pageBusy)return;
 const serial=pageSerial;pageBusy=true;
 try{
  const frame=pageFrame,win=frame.contentWindow,doc=frame.contentDocument;
  const capture=await getCaptureLibrary();
  if(serial!==pageSerial)return;
  const canvas=await capture(doc.documentElement,{x:win.scrollX,y:win.scrollY,width:1000,height:720,
   windowWidth:1000,windowHeight:720,scale:1,useCORS:true,logging:false,imageTimeout:4000,
   backgroundColor:'#0b1521',scrollX:win.scrollX,scrollY:win.scrollY});
  if(serial!==pageSerial)return;
  if(!pageTexture){pageTexture=new T.CanvasTexture(canvas);pageTexture.colorSpace=T.SRGBColorSpace;
   pageTexture.generateMipmaps=false;pageTexture.minFilter=T.LinearFilter;pageSurface.material.map=pageTexture;pageSurface.material.needsUpdate=true;
  }else{pageTexture.image=canvas;pageTexture.needsUpdate=true;}
  pageSurface.visible=true;pageMessage.visible=false;
 }catch(error){if(serial===pageSerial){setText(pageMessage,'PAGE UNAVAILABLE');pageMessage.visible=true;}console.warn('VR page view',error);}

}

async function syncScene(manual=true){
 if(syncing)return;syncing=true;if(manual)setText(updatePanel,'CHECKING FOR UPDATE');
 try{
 const response=await fetch('/holodeck-scene.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);
 const data=await response.json();
 const pos=v=>Array.isArray(v)&&v.length===3&&v.every(n=>typeof n==='number'&&Number.isFinite(n)&&Math.abs(n)<=100);
 const color=v=>typeof v==='string'&&/^#[0-9a-f]{6}$/i.test(v);
 if(data.schema!==1||typeof data.revision!=='string'||!/^\d{3}(\.\d{1,4})?$/.test(data.revision)||!pos(data.nova?.position)||!Number.isFinite(data.nova?.scale)||data.nova.scale<.2||data.nova.scale>3||!color(data.starColor)||!color(data.background)||!Array.isArray(data.objects)||data.objects.length>50||!data.objects.every(o=>['sphere','box'].includes(o.type)&&pos(o.position)&&Number.isFinite(o.size)&&o.size>=.05&&o.size<=10&&color(o.color)))throw Error('Invalid scene');
 if(liveRevision===data.revision){if(manual)setText(updatePanel,'ALREADY UP TO DATE');return;}
 const next=data.objects.filter(o=>!(o.type==='sphere'&&o.color.toLowerCase()==='#89dfff')).map(o=>{const m=new T.Mesh(o.type==='sphere'?new T.SphereGeometry(o.size,24,16):new T.BoxGeometry(o.size,o.size,o.size),new T.MeshStandardMaterial({color:o.color,emissive:o.color,emissiveIntensity:.25}));m.position.fromArray(o.position);return m;});
 for(const child of [...liveGroup.children]){liveGroup.remove(child);child.geometry.dispose();child.material.dispose();}
 liveGroup.add(...next);novaHome.fromArray(data.nova.position);nova.scale.setScalar(data.nova.scale);sky.material.color.set(data.starColor);if(onRainbow)bridgeBackground.set(data.background);else scene.background.set(data.background);
 liveRevision=data.revision;setText(note,'V016.1 • SCENE '+liveRevision);setText(updatePanel,'LIVE UPDATE APPLIED');
 }catch(e){if(manual||!liveRevision)setText(updatePanel,'UPDATE FAILED - RETRY');console.warn('Scene update',e);}finally{syncing=false;}
}

const bridgeBackground=new T.Color();const savedRig=new T.Vector3();let savedYaw=0;
function switchRainbow(enter){if(enter===onRainbow)return;showNexus(false);if(enter){bridgeBackground.copy(scene.background);savedRig.copy(rig.position);savedYaw=rig.rotation.y;}onRainbow=enter;rainbow.visible=enter;for(const o of bridgeObjects)o.visible=!enter;galaxy.visible=sky.visible=nova.visible=liveGroup.visible=!enter;scene.background.set(enter?0x91c9ef:bridgeBackground);if(enter){rig.position.set(0,0,7);rig.rotation.set(0,0,0);}else{rig.position.copy(savedRig);rig.rotation.y=savedYaw;}if(!renderer.xr.isPresenting){camera.position.set(0,1.65,enter?0:5);camera.rotation.set(0,0,0);}status.textContent=enter?'Rainbow Promise VR prototype • select beam-back pad to return':'Bridge online.';}
const ray=new T.Raycaster();const controllers=[];let armed=null,armedUntil=0;
const marker=new T.Mesh(new T.SphereGeometry(.045,12,8),new T.MeshBasicMaterial({color:0xffe778}));marker.visible=false;scene.add(marker);
function controllerRay(c){const m=new T.Matrix4().extractRotation(c.matrixWorld);ray.ray.origin.setFromMatrixPosition(c.matrixWorld);ray.ray.direction.set(0,0,-1).applyMatrix4(m).normalize();ray.camera=renderer.xr.getCamera();}
function activate(){
 const hit=ray.intersectObjects(activeTargets())[0];if(!hit)return;
 const data=hit.object.userData;
 if(data.pageAction){pageAction(data.pageAction);return;}
 if(data.returnBridge){switchRainbow(false);return;}
 if(data.nova){showNexus(true);return;}
 if(data.galaxy){showNexus(true);const i=choices.findIndex(c=>c.url===data.url);if(i>=0)pick(i);return;}
 if(data.toggle){expanded=!expanded;armed=null;armedUntil=0;refreshNexus();return;}
 if(Number.isInteger(data.choice)){pick(data.choice);return;}
 if(data.closeNexus){showNexus(false);return;}
 if(data.voice){startVoice();return;}
 if(data.speed){speedIndex=(speedIndex+1)%speeds.length;paint(speedTile,'Walk speed: '+speedNames[speedIndex]);return;}
 if(data.motion){const modes=['Roam','Follow','Station'];movementMode=modes[(modes.indexOf(movementMode)+1)%modes.length];paint(motion,'Movement: '+movementMode);setNexusStatus('NOVA • '+movementMode.toUpperCase());return;}
 if(!data.go)return;
 const choice=choices[selected];if(!choice){setNexusStatus('CHOOSE A DESTINATION FIRST');return;}
 if(choice.url && renderer.xr.isPresenting){openPage(choice.url);return;}
 if(choice.url==='/rainbow-promise.html'){switchRainbow(true);return;}
 if(choice.refresh){syncScene();return;}
 if(choice.exit){showNexus(false);if(renderer.xr.isPresenting)renderer.xr.getSession().end();return;}
 if(renderer.xr.isPresenting){
 if(armed!==choice.url||performance.now()>armedUntil){armed=choice.url;armedUntil=performance.now()+7000;setNexusStatus('PRESS OPEN AGAIN TO TRAVEL');return;}
 const url=choice.url;showNexus(false);renderer.xr.getSession().end().then(()=>location.assign(url));
 }else location.assign(choice.url);
}
const confirmLabel=label('TRIGGER AGAIN TO TRAVEL');confirmLabel.visible=false;scene.add(confirmLabel);
for(let i=0;i<2;i++){const c=renderer.xr.getController(i);rig.add(c);controllers.push(c);c.userData.connected=false;c.addEventListener('connected',()=>c.userData.connected=true);c.addEventListener('disconnected',()=>c.userData.connected=false);const line=new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(),new T.Vector3(0,0,-8)]),new T.LineBasicMaterial({color:0x65dfff}));c.add(line);c.addEventListener('select',()=>{scene.updateMatrixWorld(true);const m=new T.Matrix4().extractRotation(c.matrixWorld);ray.ray.origin.setFromMatrixPosition(c.matrixWorld);ray.ray.direction.set(0,0,-1).applyMatrix4(m).normalize();ray.camera=renderer.xr.getCamera();activate()})}
// Comfortable seated or standing VR locomotion. Left stick walks, right stick snap-turns.
let walkTime=0,turnReady=true;
const walkEye=new T.Vector3(),walkDir=new T.Vector3(),walkRight=new T.Vector3(),walkDelta=new T.Vector3();
function canWalk(x,z){
 if(onRainbow)return Math.abs(x)<35&&Math.abs(z)<35;
 return x>=-5.95&&x<=5.95&&z>=-5.05&&z<=9.05&&!(Math.abs(x)<2.48&&z>.12&&z<1.88);
}
function stick(input){
 const a=input?.gamepad?.axes;if(!a||a.length<2)return [0,0];
 return a.length>=4?[a[2]||0,a[3]||0]:[a[0]||0,a[1]||0];
}
function walkBridge(time){
 const dt=walkTime?Math.min(.05,Math.max(0,time-walkTime)):0;walkTime=time;
 if(!renderer.xr.isPresenting||nexus.visible||pageGroup.visible||!dt)return;
 const inputs=Array.from(renderer.xr.getSession()?.inputSources||[]);
 const left=inputs.find(i=>i.handedness==='left'),right=inputs.find(i=>i.handedness==='right');
 const view=renderer.xr.getCamera();view.getWorldPosition(walkEye);walkDir.set(0,0,-1).applyQuaternion(view.getWorldQuaternion(new T.Quaternion()));
 walkDir.y=0;if(walkDir.lengthSq()<.01)walkDir.set(0,0,-1);walkDir.normalize();
 walkRight.set(-walkDir.z,0,walkDir.x);
 let [x,y]=stick(left);const mag=Math.hypot(x,y);
 if(mag>.22){
 const speed=speeds[speedIndex]*Math.min(1,(mag-.22)/.78);
 walkDelta.copy(walkRight).multiplyScalar(x/mag).addScaledVector(walkDir,-y/mag).multiplyScalar(speed*dt);
 if(canWalk(walkEye.x+walkDelta.x,walkEye.z)){rig.position.x+=walkDelta.x;walkEye.x+=walkDelta.x;}
 if(canWalk(walkEye.x,walkEye.z+walkDelta.z)){rig.position.z+=walkDelta.z;walkEye.z+=walkDelta.z;}
 }
 const [rx]=stick(right);
 if(Math.abs(rx)<.35)turnReady=true;
 if(Math.abs(rx)>.7&&turnReady){
 turnReady=false;
 const angle=-Math.sign(rx)*Math.PI/6;
 const offset=walkEye.clone().sub(rig.position);
 offset.y=0;
 const rotated=offset.clone().applyAxisAngle(new T.Vector3(0,1,0),angle);
 rig.position.add(offset.sub(rotated));rig.rotation.y+=angle;
 }
}
let down=null,yaw=0,pitch=0;const canvas=renderer.domElement;canvas.style.touchAction='none';canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,yaw,pitch};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!down||renderer.xr.isPresenting)return;yaw=down.yaw-(e.clientX-down.x)*.004;pitch=T.MathUtils.clamp(down.pitch-(e.clientY-down.y)*.004,-1.2,1.2);camera.rotation.set(pitch,yaw,0,'YXZ')});canvas.addEventListener('pointerup',e=>{if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<8){ray.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2),camera);activate()}down=null});canvas.addEventListener('pointercancel',()=>down=null);
renderer.xr.addEventListener('sessionstart',()=>{camera.rotation.set(0,0,0);rig.position.set(0,0,5);rig.rotation.set(0,0,0);walkTime=0;turnReady=true});renderer.xr.addEventListener('sessionend',()=>{closePage();if(onRainbow)switchRainbow(false);showNexus(false);rig.position.set(0,0,0);rig.rotation.set(0,0,0);camera.position.set(0,1.65,5);camera.rotation.set(pitch,yaw,0,'YXZ')});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function moveNova(time){
 if(onRainbow)return;
 const dt=lastMotion?Math.min(.05,Math.max(0,time-lastMotion)):0;lastMotion=time;
 if(nexus.visible||!dt)return;
 if(movementMode==='Station'){motionGoal.copy(novaHome);}
 else if(movementMode==='Roam'){
 const p=roamPoints[roamIndex];motionGoal.set(p[0],0,p[1]);
 if(nova.position.distanceTo(motionGoal)<.22){roamIndex=(roamIndex+1)%roamPoints.length;}
 }else{
 const view=renderer.xr.isPresenting?renderer.xr.getCamera():camera;
 const eye=view.getWorldPosition(new T.Vector3());
 const dir=new T.Vector3(0,0,-1).applyQuaternion(view.getWorldQuaternion(new T.Quaternion()));dir.y=0;
 if(dir.lengthSq()<.01)dir.set(0,0,-1);dir.normalize();
 const right=new T.Vector3(-dir.z,0,dir.x);
 motionGoal.copy(eye).addScaledVector(dir,1.8).addScaledVector(right,.85);
 motionGoal.x=T.MathUtils.clamp(motionGoal.x,-5,5);motionGoal.z=T.MathUtils.clamp(motionGoal.z,-4,7.5);
 motionGoal.y=T.MathUtils.clamp(eye.y-1.65,-.6,1.0);
 const relative= nova.position.clone().sub(eye); if(relative.dot(dir)<-.15 || relative.length()>4.5){nova.position.copy(motionGoal);}
 }
 // Keep the orb clear of the central console, taking a side route when crossing it.
 if(nova.position.z>1.8&&motionGoal.z<1.8&&Math.abs(nova.position.x)<2.9){motionGoal.set(nova.position.x>=0?3.2:-3.2,0,2.2);}
 else if(nova.position.z<.1&&motionGoal.z>.1&&Math.abs(nova.position.x)<2.9){motionGoal.set(nova.position.x>=0?3.2:-3.2,0,-.2);}
 if(Math.abs(motionGoal.x)<2.9&&motionGoal.z>.05&&motionGoal.z<2.0){motionGoal.x=motionGoal.x>=0?3.2:-3.2;}
 const delta=motionGoal.clone().sub(nova.position);const distance=delta.length();
 if(distance>.035)nova.position.addScaledVector(delta,Math.min(1,dt*(movementMode==='Follow'?3.8:.65)/distance));
}
renderer.setAnimationLoop(()=>{sky.rotation.y+=.00015;const time=performance.now()*.001;walkBridge(time);moveNova(time);driftGalaxy(time);orbUniforms.uTime.value=time;orb.position.y=1.65+.035*Math.sin(time*1.4);orb.scale.setScalar((nexus.visible?1.13:1)+.025*Math.sin(time*2));halo.position.copy(orb.position);const pulse=.5+.5*Math.sin(time*3.2);halo.scale.setScalar(1.03+.18*pulse);halo.material.opacity=.12+.28*pulse;if(time*1000>feedbackUntil)feedback.visible=false;if(performance.now()>armedUntil)confirmLabel.visible=false;marker.visible=false;for(const p of targets){if(p.material?.emissive&&p.userData.url)p.material.emissive.setHex(0);}
if(renderer.xr.isPresenting){scene.updateMatrixWorld(true);for(const c of controllers){if(!c.userData.connected)continue;controllerRay(c);const hit=ray.intersectObjects(activeTargets())[0];if(hit){marker.position.copy(hit.point);marker.visible=true;if(hit.object.userData.url){for(const p of targets){if(p.material?.emissive&&p.userData.url===hit.object.userData.url)p.material.emissive.setHex(0x666666);}}}}}
renderer.render(scene,camera)});status.textContent='Bridge online. Nexus voice is optional and browser-dependent.';syncScene(false);setInterval(()=>syncScene(false),20000);
