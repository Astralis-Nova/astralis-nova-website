// Comfortable seated or standing VR locomotion. Left stick walks, right stick snap-turns.

const walkEye=new T.Vector3(),walkDir=new T.Vector3(),walkRight=new T.Vector3(),walkDelta=new T.Vector3();
function canWalk(x,z){
 if(onRainbow||onToon)return Math.abs(x)<30&&Math.abs(z)<35;

}
function stick(input){
 const a=input?.gamepad?.axes;if(!a||a.length<2)return [0,0];

}
function walkBridge(time){
 const dt=walkTime?Math.min(.05,Math.max(0,time-walkTime)):0;walkTime=time;
 if(!renderer.xr.isPresenting||nexus.visible||pageGroup.visible||!dt)return;

 const left=inputs.find(i=>i.handedness==='left'),right=inputs.find(i=>i.handedness==='right');
 const view=renderer.xr.getCamera();view.getWorldPosition(walkEye);walkDir.set(0,0,-1).applyQuaternion(view.getWorldQuaternion(new T.Quaternion()));

 let [x,y]=stick(left);const mag=Math.hypot(x,y);

 }

 }
}

function moveNova(time){
 if(onRainbow||onToon)return;
 const dt=lastMotion?Math.min(.05,Math.max(0,time-lastMotion)):0;lastMotion=time;
 if(nexus.visible||!dt)return;
 if(movementMode==='Station'){motionGoal.copy(novaHome);}
 else if(movementMode==='Roam'){
 const p=roamPoints[roamIndex];motionGoal.set(p[0],0,p[1]);
 if(nova.position.distanceTo(motionGoal)<.22){roamIndex=(roamIndex+1)%roamPoints.length;}
 }else{
 const view=renderer.xr.isPresenting?renderer.xr.getCamera():camera;
 const eye=view.getWorldPosition(new T.Vector3());
 const dir=new T.Vector3(0,0,-1).applyQuaternion(view.getWorldQuaternion(new T.Quaternion()));dir.y=0;
 if(dir.lengthSq()<.01)dir.set(0,0,-1);dir.normalize();

 motionGoal.copy(eye).addScaledVector(dir,1.8).addScaledVector(right,.85);
 motionGoal.x=T.MathUtils.clamp(motionGoal.x,-5,5);motionGoal.z=T.MathUtils.clamp(motionGoal.z,-4,7.5);
 motionGoal.y=T.MathUtils.clamp(eye.y-1.65,-.6,1.0);

 }
 // Keep the orb clear of the central console, taking a side route when crossing it.
 if(nova.position.z>1.8&&motionGoal.z<1.8&&Math.abs(nova.position.x)<2.9){motionGoal.set(nova.position.x>=0?3.2:-3.2,0,2.2);}
 else if(nova.position.z<.1&&motionGoal.z>.1&&Math.abs(nova.position.x)<2.9){motionGoal.set(nova.position.x>=0?3.2:-3.2,0,-.2);}
 if(Math.abs(motionGoal.x)<2.9&&motionGoal.z>.05&&motionGoal.z<2.0){motionGoal.x=motionGoal.x>=0?3.2:-3.2;}
 const delta=motionGoal.clone().sub(nova.position);const distance=delta.length();
 if(distance>.035)nova.position.addScaledVector(delta,Math.min(1,dt*(movementMode==='Follow'?3.8:.65)/distance));
}
