<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astralis Holodeck</title><style>body{margin:0;background:#030814;color:#e2f4ff;font:16px system-ui}#hud{position:absolute;z-index:2;top:12px;left:12px;background:#071425dd;padding:14px;border:1px solid #487da5;border-radius:12px;max-width:340px}a{color:#92ddff}button{padding:8px}canvas{display:block}small{display:block}</style></head><body><div id="hud"><b>✦ ASTRALIS HOLODECK / 004</b><p id="status">Initializing bridge…</p><small>Drag to look. Click a planet or point a VR controller and press trigger.</small><p><a href="/">Return home</a> · <a href="/player/">Music</a></p></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import {VRButton} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/webxr/VRButton.js';
const status=document.querySelector('#status');
try{
const scene=new T.Scene();scene.background=new T.Color(0x020510);
const camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);camera.position.set(0,1.65,5);
const rig=new T.Group();rig.add(camera);scene.add(rig);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;document.body.append(renderer.domElement,VRButton.createButton(renderer));
scene.add(new T.HemisphereLight(0xcbeaff,0x182133,2));const sun=new T.DirectionalLight(0xffe4bc,3);sun.position.set(-5,8,6);scene.add(sun);
function box(x,y,z,w,h,d,color){const m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshStandardMaterial({color,metalness:.45,roughness:.5}));m.position.set(x,y,z);scene.add(m);return m}
box(0,-.15,2,14,.3,15,0x233b50);box(0,4.1,2,14,.2,15,0x14263b);for(const x of [-6.5,6.5]){box(x,2,2,.3,4,15,0x253d52);for(let z=-4;z<9;z+=2)box(x*.97,.45,z,.1,.1,1.5,0x42caff)}
box(0,0.6,1,4,1.2,.8,0x27465d);box(0,1.24,1,4.1,.08,.85,0x49b8d9);
const stars=new Float32Array(2400*3);for(let i=0;i<stars.length;i+=3){const a=Math.random()*Math.PI*2,u=Math.random()*2-1,r=70+Math.random()*80;stars[i]=r*Math.sqrt(1-u*u)*Math.cos(a);stars[i+1]=r*u;stars[i+2]=r*Math.sqrt(1-u*u)*Math.sin(a)}const geo=new T.BufferGeometry();geo.setAttribute('position',new T.BufferAttribute(stars,3));const sky=new T.Points(geo,new T.PointsMaterial({color:0xd6eaff,size:.18}));scene.add(sky);
const targets=[];const worlds=[['CHESS PORTAL','/chess/',0x52b9ff],['TOON PLANET','/toon-planet.html',0xca63f1],['RAINBOW PROMISE','/rainbow-promise.html',0x4bdb95],['MUSIC PLAYER','/player/',0xffbc55]];
function label(name){const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');g.fillStyle='#08172b';g.fillRect(0,0,512,128);g.strokeStyle='#56c8ff';g.strokeRect(3,3,506,122);g.fillStyle='#e0f7ff';g.textAlign='center';g.font='bold 32px sans-serif';g.fillText(name,256,76);const tex=new T.CanvasTexture(c);tex.colorSpace=T.SRGBColorSpace;const s=new T.Sprite(new T.SpriteMaterial({map:tex}));s.scale.set(2,.5,1);return s}
// Version display is part of the loaded scene, not a remote version estimate.
const versionPanel=label('HOLODECK VERSION 004');
versionPanel.position.set(0,1.65,1.48);versionPanel.scale.set(2.6,.65,1);scene.add(versionPanel);
worlds.forEach(([name,url,color],i)=>{const p=new T.Mesh(new T.SphereGeometry(.68,32,24),new T.MeshStandardMaterial({color,roughness:.65}));p.position.set((i-1.5)*2.5,2,-3.8);p.userData={name,url};scene.add(p);targets.push(p);const l=label(name);l.position.copy(p.position);l.position.y-=1.05;scene.add(l);l.userData=p.userData;targets.push(l)});
// Nova holographic presence: visual companion, no microphone or API connection.
const nova=new T.Group();nova.position.set(3.7,0,2.7);scene.add(nova);
const holo=new T.MeshStandardMaterial({color:0x78e9ff,emissive:0x1686bd,emissiveIntensity:.7,transparent:true,opacity:.82,roughness:.35});
const dark=new T.MeshStandardMaterial({color:0x102a49,emissive:0x164477,emissiveIntensity:.4});
function part(geometry,x,y,z,material=holo){const mesh=new T.Mesh(geometry,material);mesh.position.set(x,y,z);nova.add(mesh);return mesh}
part(new T.CylinderGeometry(.55,.65,.12,48),0,.08,0,dark);
const ring=part(new T.TorusGeometry(.52,.025,12,64),0,.16,0);ring.rotation.x=Math.PI/2;
const body=part(new T.CapsuleGeometry(.23,.38,8,16),0,1.16,0,dark);
part(new T.SphereGeometry(.225,32,24),0,1.73,0);
part(new T.BoxGeometry(.32,.065,.055),0,1.75,.19,dark);
for(const x of [-.095,.095])part(new T.SphereGeometry(.035,16,12),x,1.75,.225);
for(const side of [-1,1]){const arm=part(new T.CapsuleGeometry(.075,.4,6,12),side*.32,1.12,0);arm.rotation.z=side*.17;part(new T.CapsuleGeometry(.095,.48,6,12),side*.13,.55,0,dark);}
part(new T.BoxGeometry(.2,.04,.04),0,1.35,.23);
const badge=label('NOVA • SCIENCE OFFICER');badge.scale.set(2.15,.54,1);badge.position.set(0,2.22,0);nova.add(badge);
const note=label('VOICE VIA CHATGPT');note.scale.set(1.7,.42,1);note.position.set(0,2.57,0);nova.add(note);
const controls=label('REFRESH HOLODECK');controls.position.set(-2.7,1.65,.2);scene.add(controls);controls.userData={refresh:true};targets.push(controls);
const refreshHit=new T.Mesh(new T.BoxGeometry(2,.5,.12),new T.MeshBasicMaterial({visible:false}));refreshHit.position.copy(controls.position);refreshHit.userData=controls.userData;scene.add(refreshHit);targets.push(refreshHit);
const novaHit=new T.Mesh(new T.BoxGeometry(1.4,2.8,.9),new T.MeshBasicMaterial({visible:false}));novaHit.position.set(0,1.4,0);novaHit.userData={nova:true,name:'NOVA'};nova.add(novaHit);targets.push(novaHit);
const exit=label('EXIT VR');exit.position.set(-2.7,1.05,.2);scene.add(exit);exit.userData={exit:true,name:'EXIT VR'};targets.push(exit);
const exitHit=new T.Mesh(new T.BoxGeometry(2,.5,.12),new T.MeshBasicMaterial({visible:false}));exitHit.position.copy(exit.position);exitHit.userData=exit.userData;scene.add(exitHit);targets.push(exitHit);
controls.userData.name='REFRESH HOLODECK';
const feedback=label('NOVA ONLINE');feedback.position.set(0,3.1,0);nova.add(feedback);feedback.visible=false;
let feedbackUntil=0;
const ray=new T.Raycaster();const controllers=[];let armed=null,armedUntil=0;
const marker=new T.Mesh(new T.SphereGeometry(.045,12,8),new T.MeshBasicMaterial({color:0xffe778}));marker.visible=false;scene.add(marker);
function controllerRay(c){const m=new T.Matrix4().extractRotation(c.matrixWorld);ray.ray.origin.setFromMatrixPosition(c.matrixWorld);ray.ray.direction.set(0,0,-1).applyMatrix4(m).normalize();ray.camera=renderer.xr.getCamera();}
function activate(){const hit=ray.intersectObjects(targets)[0];if(hit){const data=hit.object.userData;if(data.nova){feedback.visible=true;feedbackUntil=performance.now()+3500;return;}if(data.exit){if(renderer.xr.isPresenting)renderer.xr.getSession().end();return;}if(hit.object.userData.refresh){if(renderer.xr.isPresenting){renderer.xr.getSession().end().then(()=>location.reload());}else location.reload();return;}if(renderer.xr.isPresenting){if(armed!==data.url||performance.now()>armedUntil){armed=data.url;armedUntil=performance.now()+4500;confirmLabel.visible=true;confirmLabel.position.copy(hit.point);confirmLabel.position.y+=.65;return;}armed=null;confirmLabel.visible=false;const session=renderer.xr.getSession();session.end().then(()=>location.assign(data.url));}else location.assign(hit.object.userData.url)}}
const confirmLabel=label('TRIGGER AGAIN TO TRAVEL');confirmLabel.visible=false;scene.add(confirmLabel);
for(let i=0;i<2;i++){const c=renderer.xr.getController(i);rig.add(c);controllers.push(c);c.userData.connected=false;c.addEventListener('connected',()=>c.userData.connected=true);c.addEventListener('disconnected',()=>c.userData.connected=false);const line=new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(),new T.Vector3(0,0,-8)]),new T.LineBasicMaterial({color:0x65dfff}));c.add(line);c.addEventListener('select',()=>{scene.updateMatrixWorld(true);const m=new T.Matrix4().extractRotation(c.matrixWorld);ray.ray.origin.setFromMatrixPosition(c.matrixWorld);ray.ray.direction.set(0,0,-1).applyMatrix4(m).normalize();ray.camera=renderer.xr.getCamera();activate()})}
let down=null,yaw=0,pitch=0;const canvas=renderer.domElement;canvas.style.touchAction='none';canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,yaw,pitch};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!down||renderer.xr.isPresenting)return;yaw=down.yaw-(e.clientX-down.x)*.004;pitch=T.MathUtils.clamp(down.pitch-(e.clientY-down.y)*.004,-1.2,1.2);camera.rotation.set(pitch,yaw,0,'YXZ')});canvas.addEventListener('pointerup',e=>{if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<8){ray.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2),camera);activate()}down=null});canvas.addEventListener('pointercancel',()=>down=null);
renderer.xr.addEventListener('sessionstart',()=>{camera.rotation.set(0,0,0);rig.position.z=5});renderer.xr.addEventListener('sessionend',()=>{rig.position.z=0;camera.position.set(0,1.65,5);camera.rotation.set(pitch,yaw,0,'YXZ')});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.setAnimationLoop(()=>{sky.rotation.y+=.00015;const time=performance.now()*.001;ring.scale.setScalar(1+.06*Math.sin(time*2));nova.rotation.y=-.95+.12*Math.sin(time*.6);holo.emissiveIntensity=.7+.15*Math.sin(time*2);if(time*1000>feedbackUntil)feedback.visible=false;if(performance.now()>armedUntil)confirmLabel.visible=false;marker.visible=false;for(const p of targets){if(p.material?.emissive&&p.userData.url)p.material.emissive.setHex(0);}
if(renderer.xr.isPresenting){scene.updateMatrixWorld(true);for(const c of controllers){if(!c.userData.connected)continue;controllerRay(c);const hit=ray.intersectObjects(targets)[0];if(hit){marker.position.copy(hit.point);marker.visible=true;if(hit.object.userData.url){for(const p of targets){if(p.material?.emissive&&p.userData.url===hit.object.userData.url)p.material.emissive.setHex(0x666666);}}}}}
renderer.render(scene,camera)});status.textContent='Bridge online. Nova visual station available; voice remains in ChatGPT.';
}catch(e){status.textContent='Bridge unavailable: '+e.message;console.error(e)}
</script></body></html>
