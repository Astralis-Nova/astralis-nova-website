// Comfortable seated or standing VR locomotion. Left stick walks, right stick snap-turns.
let walkTime=0,turnReady=true;
const walkEye=new T.Vector3(),walkDir=new T.Vector3(),walkRight=new T.Vector3(),walkDelta=new T.Vector3();
function canWalk(x,z){
 return x>=-5.95&&x<=5.95&&z>=-5.05&&z<=9.05&&!(Math.abs(x)<2.48&&z>.12&&z<1.88);
}
function stick(input){
 const a=input?.gamepad?.axes;if(!a||a.length<2)return [0,0];

}
function walkBridge(time){
 const dt=walkTime?Math.min(.05,Math.max(0,time-walkTime)):0;walkTime=time;
 if(!renderer.xr.isPresenting||nexus.visible||!dt)return;
 const inputs=Array.from(renderer.xr.getSession()?.inputSources||[]);
 const left=inputs.find(i=>i.handedness==='left'),right=inputs.find(i=>i.handedness==='right');
 const view=renderer.xr.getCamera();view.getWorldPosition(walkEye);view.getWorldDirection(walkDir);
 walkDir.y=0;if(walkDir.lengthSq()<.01)walkDir.set(0,0,-1);walkDir.normalize();
 walkRight.set(-walkDir.z,0,walkDir.x);
 let [x,y]=stick(left);const mag=Math.hypot(x,y);
 if(mag>.22){

 walkDelta.copy(walkRight).multiplyScalar(x/mag).addScaledVector(walkDir,-y/mag).multiplyScalar(speed*dt);
 if(canWalk(walkEye.x+walkDelta.x,walkEye.z)){rig.position.x+=walkDelta.x;walkEye.x+=walkDelta.x;}
 if(canWalk(walkEye.x,walkEye.z+walkDelta.z)){rig.position.z+=walkDelta.z;walkEye.z+=walkDelta.z;}
 }
 const [rx]=stick(right);
 if(Math.abs(rx)<.35)turnReady=true;
 if(Math.abs(rx)>.7&&turnReady){
 turnReady=false;
 const angle=-Math.sign(rx)*Math.PI/6;
 const offset=walkEye.clone().sub(rig.position);
 offset.y=0;
 const rotated=offset.clone().applyAxisAngle(new T.Vector3(0,1,0),angle);

 }
}

function moveNova(time){
 const dt=lastMotion?Math.min(.05,Math.max(0,time-lastMotion)):0;lastMotion=time;
 if(nexus.visible||!dt)return;
 if(movementMode==='Station'){motionGoal.copy(novaHome);}
 else if(movementMode==='Roam'){
