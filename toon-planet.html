@keyframes orbitCamera{from{transform:scale(1.10) translate3d(-.4%,.3%,0)}to{transform:scale(1.13) translate3d(.45%,-.35%,0)}}
@keyframes orbitAtmosphere{from{opacity:.10}to{opacity:.23}}
@keyframes orbitStarBreath{from{opacity:.07}to{opacity:.24}}

@keyframes starsWink{from{opacity:.24}to{opacity:.79}}
@keyframes nebulaBreathe{from{opacity:.46;transform:rotate(-22deg) translate(-1.5%,0)}to{opacity:.82;transform:rotate(-22deg) translate(1.5%,-1%)}}

@keyframes moonBreathe{50%{opacity:.65}}

@keyframes cactusSway{from{transform:rotate(-.35deg)}to{transform:rotate(.4deg)}}

}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}
 .space-stars,.galactic-cloud,.distant-world,.space-kicker,.surface-stars,.surface-haze,
 .toon-desert-foreground .saguaro-motion,.toon-desert-foreground .mesquite-motion,
 .toon-desert-foreground .ocotillo-motion,.toon-desert-foreground .desert-grass,
 .underground-dust,.underground-moisture,.orbit-photo,.space-photo-shade::after,
 .orbit-twinkle,.underground-photo,.soil-grain{animation:none!important}

/* Scenery-only canvas: small iconic controls, absolutely no visible text. */
.brand-link{display:flex;align-items:center;justify-content:center;width:44px;height:44px;
 min-width:44px;min-height:44px;padding:0;border-radius:50%;font-size:0}

.orbit-photo{animation-duration:38s}

<!-- Scenery-only phase: no visible headings, explanations, credits or character gallery.
     Sources: NASA ISS orbital photo and USGS arid rangeland soil photo.
     The surface is original Astralis Nova Cactus Forest Moonlight artwork. -->
<a class="brand-link" href="/" aria-label="Return to Astralis Nova home">
 <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M9.5 20v-7h5v7"/></svg>
</a>
<nav class="level-nav" aria-label="Navigate between world levels">
 <a href="#space" data-level="space" aria-label="Space above Cactus Forest"><span aria-hidden="true">✦</span></a>
 <a href="#surface" data-level="surface" aria-label="Cactus Forest Moonlight surface"><span aria-hidden="true">🌵</span></a>

<main class="world" id="toonWorld">
<section class="region region-space" id="space" aria-label="Space above Cactus Forest">

  <div class="orbit-photo"></div><div class="space-photo-shade"></div>
  <div class="orbit-twinkle"></div><div class="orbit-filmgrain"></div><div class="space-atmosphere"></div>
 </div>
</section>
<section class="region region-surface" id="surface" aria-label="Cactus Forest Moonlight landscape">
 <div class="surface-cover" aria-hidden="true"></div>
 <div class="surface-color" aria-hidden="true"></div>
 <div class="surface-stars" aria-hidden="true"></div>
 <div class="surface-haze" aria-hidden="true"></div>

<section class="region region-underground" id="underground" aria-label="Underground soil and rocks">
 <div class="underground-strata" aria-hidden="true"><div class="underground-photo"></div></div>
 <div class="underground-topsoil" aria-hidden="true"></div>
 <div class="soil-grain" aria-hidden="true"></div>
 <div class="underground-dust" aria-hidden="true"></div>
</section>
</main>
<script>
(function(){
 "use strict";
 const links=Array.from(document.querySelectorAll(".level-nav a"));
 const sections=Array.from(document.querySelectorAll(".region"));
 const surface=document.getElementById("surface");
 const motionReduced=window.matchMedia("(prefers-reduced-motion: reduce)");
 const orbitalPhoto=document.querySelector(".orbit-photo");
 const soilPhoto=document.querySelector(".underground-photo");
 const orbitalSection=document.getElementById("space");
 const undergroundSection=document.getElementById("underground");
 let sceneFrame=0;
 function clamp(value,limit){return Math.max(-limit,Math.min(limit,value))}
 function applySceneParallax(){
  sceneFrame=0;
  if(motionReduced.matches)return;
  const midpoint=window.scrollY+window.innerHeight*.5;
  const narrow=window.innerWidth<=800;
  for(const scene of [
   {section:orbitalSection,photo:orbitalPhoto,property:"--orbit-scroll",range:narrow?12:26},
   {section:undergroundSection,photo:soilPhoto,property:"--soil-scroll",range:narrow?9:18}
  ]){
   if(!scene.section||!scene.photo)continue;
   const center=scene.section.offsetTop+scene.section.offsetHeight*.5;
   const relative=(midpoint-center)/Math.max(1,scene.section.offsetHeight);
   const pixels=clamp(relative*scene.range*1.7,scene.range);
   scene.photo.style.setProperty(scene.property,pixels.toFixed(1)+"px");
  }
 }
 function requestSceneUpdate(){
  if(!sceneFrame&&!motionReduced.matches)sceneFrame=window.requestAnimationFrame(applySceneParallax);
 }
 function updateLevel(){
  const midpoint=window.scrollY+window.innerHeight*.50;
  let active=sections[0].id;
  for(const section of sections){if(section.offsetTop<=midpoint)active=section.id;}
  for(const link of links){
   if(link.dataset.level===active)link.setAttribute("aria-current","location");
   else link.removeAttribute("aria-current");
  }
 }
 // On a fresh visit, arrive at the familiar moonlit surface. Visitors can
 // scroll upward to space or downward into the underground scene.
 function enterAtSurface(){
  if(window.location.hash)return;
  const nav=window.performance&&window.performance.getEntriesByType&&
    window.performance.getEntriesByType("navigation")[0];
  if(nav&&nav.type!=="navigate")return; // Preserve refresh, Back, and scroll restoration.
  if(window.scrollY>10)return;
  window.scrollTo({top:surface.offsetTop,behavior:"instant"});
  updateLevel();requestSceneUpdate();
 }
 window.addEventListener("scroll",()=>{updateLevel();requestSceneUpdate()},{passive:true});
 window.addEventListener("resize",()=>{updateLevel();requestSceneUpdate()},{passive:true});
 window.addEventListener("hashchange",()=>{updateLevel();requestSceneUpdate()});
 if(motionReduced.addEventListener)motionReduced.addEventListener("change",()=>{
  if(motionReduced.matches){
   if(sceneFrame){window.cancelAnimationFrame(sceneFrame);sceneFrame=0}
   orbitalPhoto?.style.removeProperty("--orbit-scroll");
   soilPhoto?.style.removeProperty("--soil-scroll");
  }else requestSceneUpdate();
 });
 if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",function(){
  window.requestAnimationFrame(enterAtSurface);updateLevel();requestSceneUpdate();
 },{once:true});
 else window.requestAnimationFrame(function(){enterAtSurface();updateLevel();requestSceneUpdate()});
})();
</script>
