name: Astralis Nova Cloudflare Maintenance

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cloudflare-maintenance.yml
      - database/chess-schema.sql
  workflow_dispatch:
    inputs:
      mission:
        description: Maintenance mission
        required: true
        default: setup-chess
        type: choice
        options:
          - verify-access
          - setup-chess
          - verify-chess

permissions:
  contents: read

concurrency:
  group: astralis-nova-cloudflare-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    name: ${{ inputs.mission }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CHESS_DATABASE: astralis-nova-chess
      CHESS_HEALTH_URL: https://astralis-nova-website.pages.dev/api/chess?action=health

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify maintenance credentials
        run: npx --yes wrangler@4 whoami

      - name: Create dedicated chess database when missing
        if: github.event_name == 'push' || inputs.mission == 'setup-chess'
        shell: bash
        run: |
          set -euo pipefail
          databases="$(npx --yes wrangler@4 d1 list --json)"
          if jq -e --arg name "$CHESS_DATABASE" '.[] | select(.name == $name)' <<<"$databases" >/dev/null; then
            echo "Chess database already exists."
          else
            npx --yes wrangler@4 d1 create "$CHESS_DATABASE"
          fi

      - name: Install chess schema
        if: github.event_name == 'push' || inputs.mission == 'setup-chess'
        run: npx --yes wrangler@4 d1 execute "$CHESS_DATABASE" --remote --file=./database/chess-schema.sql

      - name: Check live chess service
        if: inputs.mission == 'verify-chess'
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail-with-body --silent --show-error "$CHESS_HEALTH_URL")"
          echo "$body" | jq .
          jq -e '.ok == true and .storage == "D1"' <<<"$body" >/dev/null

      - name: Next binding instruction
        if: github.event_name == 'push' || inputs.mission == 'setup-chess'
        run: |
          echo "Database and schema are ready."
          echo "In Cloudflare Pages, bind astralis-nova-chess as CHESS_DB."
          echo "Keep the existing guestbook DB binding unchanged, then redeploy production."
