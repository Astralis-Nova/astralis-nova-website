name: Astralis Nova Pages Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: astralis-nova-pages-production
  cancel-in-progress: false

jobs:
  release:
    name: Validate and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate homepage runtime
        run: |
          node --check astralis-performance-loader.js
          node --check site-fixes.js
          node --check cosmic-worlds.js
          node --check our-new-star.js
          node --check realistic-orbit.js
          node --check astralis-celestial-drift.js
          node --check astralis-ai-upgrades.js
          node --check astralis-stragglers.js
          node --check realistic-galaxy-upgrade.js
          node --check astralis-brand-orbit.js
          node --check final-visual-fixes.js
          node --check astralis-nova-explorer.js
          node --check rickroll-planet.js
          node --check recent-exoplanets.js
          node --check conquest-media.js
          node --check vulcan-salute.js
          node --check cosmic-chuckles.js
          node --check hawking-quote-data-a.js
          node --check hawking-quote-data-b.js
          node --check hawking-quote.js
          node --check astralis-motion-restore.js
          node --input-type=module --check < functions/_middleware.js

      - name: Validate Our New Star and community
        run: |
          node --check our-new-star-elements.js
          node --check our-new-star-science.js
          node --check our-new-star-community.js
          node --test tests/our-new-star-community.test.cjs tests/our-new-star-api.test.mjs tests/ac-community-api.test.mjs tests/ac-community-ui.test.cjs

      - name: Validate chess portal
        run: |
          node --check chess/chess.js
          node --check chess/pieces.js
          node --check chess/trideck-engine.js
          node --test chess/trideck-engine.test.mjs

      - name: Inspect Cloudflare Pages production target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          url = f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/astralis-nova-website'
          request = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'})
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)
          project = payload.get('result') or {}
          latest = project.get('latest_deployment') or {}
          trigger = (latest.get('deployment_trigger') or {}).get('metadata') or {}
          print('Pages project:', project.get('name'))
          print('Subdomain:', project.get('subdomain'))
          print('Production branch:', project.get('production_branch'))
          print('Latest deployment environment:', latest.get('environment'))
          print('Latest deployment branch:', trigger.get('branch'))
          PY

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=astralis-nova-website --branch=main --commit-hash=${{ github.sha }} --commit-message="Astralis Nova production release"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify public chess release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, os, re, time, urllib.request
          release = os.environ['RELEASE_SHA']
          local = open('chess/index.html','rb').read()
          local_hash = hashlib.sha256(local).hexdigest()
          url = f'https://astralis-nova-website.pages.dev/chess/?release={release}'
          last_error = None
          remote = b''
          for attempt in range(6):
              try:
                  request = urllib.request.Request(url, headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'Astralis-Release-Verifier/1.0'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      remote = response.read()
                  if remote:
                      break
              except Exception as exc:
                  last_error = exc
                  time.sleep(2)
          if not remote:
              raise RuntimeError(f'Could not fetch production chess page: {last_error}')
          text = remote.decode('utf-8','replace')
          remote_hash = hashlib.sha256(remote).hexdigest()
          title = re.search(r'<title>(.*?)</title>', text, re.I|re.S)
          print('Production chess title:', title.group(1).strip() if title else 'missing')
          print('Production has V5 marker:', 'trid-piece-visibility.css?v=1' in text)
          print('Production has Arrange Boards:', 'Arrange Boards' in text)
          print('Local SHA256:', local_hash)
          print('Remote SHA256:', remote_hash)
          print('Production HTML matches repository:', local_hash == remote_hash)
          if 'trid-piece-visibility.css?v=1' not in text:
              raise RuntimeError('Production /chess/ does not contain the current V5 piece-visibility asset marker.')
          PY
