name: ACInfo importer tests
on:
  pull_request:
    paths:
      - 'acinfo/**'
      - 'functions/api/acinfo/**'
      - '.github/workflows/acinfo-tests.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run archive import and SQLite FTS5 tests
        run: python -m unittest discover -s acinfo -p 'test_*.py' -v
