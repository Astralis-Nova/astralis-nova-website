<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astralis Nova Memories Admin</title><style>body{margin:0;background:#070b16;color:#eef4ff;font-family:Arial,sans-serif;min-height:100vh}main{max-width:760px;margin:auto;padding:32px 20px}.card{background:#10182a;border:1px solid #26385c;border-radius:18px;padding:22px;box-shadow:0 18px 60px #0007}h1{margin-top:0}.muted{color:#a8b4cb}label{display:block;margin:14px 0 6px}input,textarea,button{width:100%;box-sizing:border-box;border-radius:10px;border:1px solid #34476f;background:#0a1020;color:#fff;padding:12px;font-size:16px}button{margin-top:16px;background:#2a5bd7;border:0;font-weight:700;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.status{margin-top:14px;white-space:pre-wrap}.drop{border:2px dashed #405985;padding:18px;border-radius:12px;text-align:center;margin-top:8px}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><main><div class="card"><h1>🔐 Cherished Memories · Owner Console</h1><p class="muted">Upload private photos to the Memories archive. Your admin token stays only in this browser tab.</p><label for="token">Admin token</label><input id="token" type="password" autocomplete="off" placeholder="Enter ADMIN_TOKEN"><div class="row"><div><label for="album">Album name</label><input id="album" placeholder="Family, Childhood, Cactus Forest..."></div><div><label for="title">Photo title</label><input id="title" placeholder="Optional title"></div></div><label for="caption">Caption / story</label><textarea id="caption" rows="4" placeholder="Who, where, when, and the story behind the photo"></textarea><label for="photo">Photo</label><div class="drop"><input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif"></div><button id="upload">Upload Private Photo</button><div id="status" class="status muted"></div></div></main><script>const $=id=>document.getElementById(id);$('upload').onclick=async()=>{const file=$('photo').files[0],token=$('token').value.trim(),album=$('album').value.trim();if(!token)return $('status').textContent='Enter your admin token.';if(!album)return $('status').textContent='Enter an album name.';if(!file)return $('status').textContent='Choose a photo.';$('upload').disabled=true;$('status').textContent='Uploading securely…';const fd=new FormData();fd.append('photo',file);fd.append('album',album);fd.append('title',$('title').value.trim());fd.append('caption',$('caption').value.trim());try{const r=await fetch('/api/memories-upload',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Upload failed.');$('status').textContent='✅ Saved privately to “'+d.album+'”.';$('photo').value='';$('title').value='';$('caption').value='';}catch(e){$('status').textContent='❌ '+e.message;}finally{$('upload').disabled=false;}};</script></body></html>
