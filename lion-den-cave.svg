  <circle cx="800" cy="570" r="32" fill="#815332"/>
  <path d="M760 600q40-30 80 0l46 154H714z" fill="url(#robe)"/>
  <path d="M775 610q-70 62-38 100" fill="none" stroke="#9a7147" stroke-width="22" stroke-linecap="round"/>
  <path d="M825 610q70 62 38 100" fill="none" stroke="#9a7147" stroke-width="22" stroke-linecap="round"/>
  <path d="M786 585q14 18 28 0" fill="none" stroke="#f0d6a2" stroke-width="8" stroke-linecap="round"/>
</g>
<g id="lionLeft" transform="translate(300 555)">
