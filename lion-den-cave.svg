<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Daniel protected in the lions' den</title><desc id="desc">A cinematic cave with Daniel praying, resting lions, and an angel descending through golden light.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#09070a"/><stop offset=".55" stop-color="#17100c"/><stop offset="1" stop-color="#050608"/></linearGradient>
  <radialGradient id="light" cx="50%" cy="0" r="70%"><stop stop-color="#fffbd0" stop-opacity=".98"/><stop offset=".18" stop-color="#ffd879" stop-opacity=".75"/><stop offset=".55" stop-color="#d78a32" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#37251a"/><stop offset=".45" stop-color="#17100d"/><stop offset="1" stop-color="#070708"/></linearGradient>
  <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e7c27c"/><stop offset="1" stop-color="#76512f"/></linearGradient>
  <linearGradient id="lion" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d99a3d"/><stop offset=".55" stop-color="#8a4f21"/><stop offset="1" stop-color="#2d160d"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<ellipse cx="800" cy="180" rx="310" ry="520" fill="url(#light)" filter="url(#blur)"/>
<path d="M0 0h420l170 900H0z" fill="url(#rock)"/><path d="M1600 0h-420l-170 900h590z" fill="url(#rock)"/>
<path d="M0 760Q250 650 510 760T1000 760T1600 735V900H0z" fill="#080809"/>
<g opacity=".22" fill="#ae7542"><circle cx="250" cy="180" r="90"/><circle cx="1350" cy="220" r="120"/><circle cx="1430" cy="620" r="150"/><circle cx="160" cy="650" r="130"/></g>
<g id="angel" filter="url(#glow)">
  <ellipse cx="800" cy="210" rx="78" ry="96" fill="#fff6ce" opacity=".32"/>
  <circle cx="800" cy="145" r="34" fill="#ffe9b0"/>
  <path d="M770 185q30-34 60 0l44 135h-148z" fill="#fff6df"/>
