<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
<!-- Subtle monochrome grain, original procedural texture for NASA and USGS photo treatment -->
<filter id="g" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".58" numOctaves="4" seed="9" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/>
</filter>
<rect width="180" height="180" filter="url(#g)" opacity=".34"/>
</svg>