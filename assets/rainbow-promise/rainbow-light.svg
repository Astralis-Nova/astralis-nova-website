<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" fill="none">
  <title>A soft primary rainbow and faint reversed secondary bow</title>
  <desc>Transparent atmospheric light only, with no photographic background or people.</desc>
  <defs>
    <!-- Inner violet to outer red; the outer bow reverses this order. -->
    <radialGradient id="primary" cx="0" cy="0" r="1.025" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cce4ef" stop-opacity=".025"/>
      <stop offset=".89" stop-color="#bed7e7" stop-opacity=".035"/>
      <stop offset=".925" stop-color="#a9a5df" stop-opacity=".04"/>
      <stop offset=".937" stop-color="#a787d4" stop-opacity=".51"/>
      <stop offset=".947" stop-color="#7089d0" stop-opacity=".65"/>
      <stop offset=".957" stop-color="#68b4d4" stop-opacity=".69"/>
      <stop offset=".967" stop-color="#82c493" stop-opacity=".73"/>
      <stop offset=".977" stop-color="#e8d574" stop-opacity=".77"/>
      <stop offset=".987" stop-color="#e9a26c" stop-opacity=".75"/>
      <stop offset=".997" stop-color="#dd7b87" stop-opacity=".7"/>
      <stop offset="1" stop-color="#d99798" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="secondary" cx="0" cy="0" r="1.185" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dfaaaa" stop-opacity="0"/>
      <stop offset=".946" stop-color="#dfaaaa" stop-opacity="0"/>
      <stop offset=".953" stop-color="#d9a6a1" stop-opacity=".1"/>
      <stop offset=".961" stop-color="#dfb695" stop-opacity=".11"/>
      <stop offset=".969" stop-color="#e0d4a0" stop-opacity=".12"/>
      <stop offset=".977" stop-color="#a4c9ac" stop-opacity=".105"/>
      <stop offset=".985" stop-color="#8fbbd2" stop-opacity=".1"/>
      <stop offset=".991" stop-color="#9c9dcb" stop-opacity=".085"/>
      <stop offset=".996" stop-color="#aca0c7" stop-opacity=".07"/>
      <stop offset="1" stop-color="#aca0c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizonFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="white"/>
      <stop offset=".36" stop-color="white"/>
      <stop offset=".49" stop-color="#a5a5a5"/>
      <stop offset=".59" stop-color="black"/>
      <stop offset="1" stop-color="black"/>
    </linearGradient>
    <radialGradient id="rainVeil">
      <stop offset="0" stop-color="white" stop-opacity=".75"/>
      <stop offset=".68" stop-color="white" stop-opacity=".95"/>
      <stop offset="1" stop-color="white"/>
    </radialGradient>
    <mask id="fade"><rect width="1536" height="1024" fill="url(#horizonFade)"/></mask>
    <mask id="rain"><rect width="1536" height="1024" fill="url(#rainVeil)"/></mask>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation=".003"/></filter>
  </defs>
  <g mask="url(#fade)"><g mask="url(#rain)">
    <g transform="translate(768 650) scale(680 500)" filter="url(#soften)">
      <rect x="-1.25" y="-1.25" width="2.5" height="1.25" fill="url(#secondary)"/>
      <rect x="-1.1" y="-1.1" width="2.2" height="1.1" fill="url(#primary)"/>
    </g>
  </g></g>
</svg>
