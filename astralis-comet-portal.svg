<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-labelledby="title desc">
<title id="title">Astralis Nova realistic luminous comet</title>
<desc id="desc">An icy bright nucleus gliding through deep space, with textured dust and glowing blue ion tails fading into transparency.</desc>
<defs>
 <linearGradient id="ion" x1="0" x2="1" y1="0" y2="0">
  <stop stop-color="#173458" stop-opacity="0"/><stop offset=".14" stop-color="#2864a0" stop-opacity=".12"/><stop offset=".42" stop-color="#388cca" stop-opacity=".27"/><stop offset=".72" stop-color="#53c7f6" stop-opacity=".66"/><stop offset="1" stop-color="#d7f8ff" stop-opacity=".96"/>
 </linearGradient>
 <linearGradient id="dust" x1="0" x2="1" y1="0" y2="0">
  <stop stop-color="#829cbb" stop-opacity="0"/><stop offset=".23" stop-color="#c0cdd9" stop-opacity=".09"/><stop offset=".57" stop-color="#a3bfdd" stop-opacity=".23"/><stop offset=".86" stop-color="#e4f4ff" stop-opacity=".45"/><stop offset="1" stop-color="#f1feff" stop-opacity=".7"/>
 </linearGradient>
 <radialGradient id="coma"><stop stop-color="#ffffff" stop-opacity=".9"/><stop offset=".15" stop-color="#c5f7ff" stop-opacity=".75"/><stop offset=".42" stop-color="#4db9f6" stop-opacity=".38"/><stop offset=".76" stop-color="#2455b4" stop-opacity=".11"/><stop offset="1" stop-color="#172859" stop-opacity="0"/></radialGradient>
 <radialGradient id="ice" cx=".28" cy=".22" r=".85"><stop stop-color="#ffffff"/><stop offset=".23" stop-color="#ecfeff"/><stop offset=".50" stop-color="#a3e8ff"/><stop offset=".76" stop-color="#4a9ad3"/><stop offset=".93" stop-color="#23518e"/><stop offset="1" stop-color="#132b58"/></radialGradient>
 <filter id="farMist" x="-20%" y="-140%" width="145%" height="380%"><feGaussianBlur stdDeviation="14"/></filter>
 <filter id="nearMist" x="-15%" y="-100%" width="140%" height="300%"><feGaussianBlur stdDeviation="4.5"/></filter>
 <filter id="frost" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency=".075" numOctaves="2" seed="8" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/></filter>
</defs>
