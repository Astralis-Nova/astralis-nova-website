<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020611">
  <meta name="description" content="Astralis Nova playable 64-square tri-dimensional chess board with a complete 32-piece set and legal chess movement adapted to Tri-D geometry.">
  <title>Astralis Nova Tri-Dimensional Chess</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./tos-tridimensional.css?v=13">
  <link rel="stylesheet" href="./trid-core-v5.css?v=5">
  <link rel="stylesheet" href="./trid-piece-visibility.css?v=2">
  <link rel="stylesheet" href="./trid-locked-layout.css?v=1">
  <link rel="stylesheet" href="./trid-rules-ready.css?v=1">
  <link rel="stylesheet" href="./trid-mobile-piece-fallback.css?v=2">
  <link rel="stylesheet" href="./trid-concept-skin.css?v=1">
</head>
<body>
<main>
  <header class="topbar">
    <div>
      <div class="eyebrow">ASTRALIS NOVA · 64-SQUARE TRI-DIMENSIONAL CHESS</div>
      <h1>Floating Glass Tri-D Command Board</h1>
      <p>Locked board layout · complete 32-piece set · legal chess movement adapted to Tri-D geometry.</p>
    </div>
    <div class="top-actions">
      <a href="../">Return to Astralis Nova</a>
    </div>
  </header>

  <section class="board-stage" aria-label="Astralis Nova 64-square tri-dimensional chess">
    <div class="scene-wrap">
      <div class="scene" id="scene" aria-label="Playable 64-square tri-dimensional chess board">
        <section class="attack attack-a1" data-board="A1"><div class="grid two" id="A1"></div></section>
        <section class="main-board board-upper" data-board="U"><div class="grid four" id="U"></div></section>
        <section class="attack attack-a2" data-board="A2"><div class="grid two" id="A2"></div></section>
        <section class="main-board board-middle" data-board="M"><div class="middle-split-shell" id="M"></div></section>
        <section class="attack attack-b1" data-board="B1"><div class="grid two" id="B1"></div></section>
        <section class="main-board board-lower" data-board="L"><div class="grid four" id="L"></div></section>
        <section class="attack attack-b2" data-board="B2"><div class="grid two" id="B2"></div></section>
      </div>
    </div>

    <div class="command-dock" aria-label="Game controls">
      <div class="status-cluster">
        <span class="mode-chip">ASTRALIS TRI-D V5 · 64 SQUARES</span>
        <strong id="gameStatus" aria-live="polite">Loading Tri-D board…</strong>
      </div>
      <div class="game-actions">
        <button id="newGame" type="button">New Game</button>
        <button id="novaToggle" type="button" class="active">Nova Black: ON</button>
        <button id="flipBoard" type="button">Flip View</button>
      </div>
    </div>

    <details class="online-dock" id="onlineMission">
      <summary>Online Mission</summary>
      <div class="online-grid">
        <label>Commander name<input id="commanderName" maxlength="32" placeholder="Commander One"></label>
        <label>Join code<input id="joinCode" maxlength="12" placeholder="NOVA-1234" autocapitalize="characters"></label>
        <label class="online-check"><input id="novaTakeover" type="checkbox" checked> Nova controls Black until a challenger joins</label>
        <div class="online-actions">
          <button id="createOnline" type="button">Create Mission</button>
          <button id="joinOnline" type="button">Join Mission</button>
          <button id="copyInvite" type="button" disabled>Copy Invite</button>
          <button id="leaveOnline" type="button" disabled>Leave Online</button>
        </div>
        <div id="onlineStatus" class="online-status" aria-live="polite">Checking mission archive…</div>
      </div>
    </details>
  </section>
</main>
<script src="./trid-fresh-start.js?v=2"></script>
<script src="./trid-locked-layout.js?v=1"></script>
<script src="./trid-core-v5.js?v=4"></script>
<script src="./trid-visible-glyphs.js?v=1"></script>
<script src="./trid-mobile-piece-fallback.js?v=1"></script>
<script src="./trid-middle-split.js?v=1"></script>
<script src="./trid-online-v1.js?v=4"></script>
<script src="./trid-rules-ready.js?v=1"></script>
</body>
</html>
