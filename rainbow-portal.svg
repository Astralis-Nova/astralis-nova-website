<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title desc">
  <title id="title">Rainbow Promise portal</title>
  <desc id="desc">A rainbow rising through rain clouds after a storm.</desc>
