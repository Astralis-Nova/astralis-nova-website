    </filter>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f8fdff"/>
      <stop offset="1" stop-color="#8bb9dc"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
