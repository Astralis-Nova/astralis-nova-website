            <path d="M180 41c-10 4-13 14-7 19 7 5 18-2 20-10 2-8-6-13-13-9Z" fill="url(#aceOpticalGlass)" stroke="#3d3734" stroke-width="2"/>
            <path d="M210 29c-13-1-19 15-12 27 7 12 22 13 30 5 11-11-2-31-18-32Z" fill="#65412d"/>
            <path d="M211 31c-12-1-17 13-10 24 5 9 20 11 26 4 9-9-3-27-16-28Z" fill="url(#aceBrassRim)" stroke-width="1.5"/>
            <path d="M211 35c-8 0-11 10-7 18 5 7 14 9 19 4 6-7-3-21-12-22Z" fill="url(#aceOpticalGlass)" stroke="#3d3734" stroke-width="2"/>
