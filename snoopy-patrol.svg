<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 350" fill="none">
  <title>Snoopy seated on his flying red doghouse</title>
  <defs>
    <linearGradient id="aceRoofPaint" x1="150" y1="210" x2="190" y2="277" gradientUnits="userSpaceOnUse"><stop stop-color="#ff6859"/><stop offset="1" stop-color="#dc3541"/></linearGradient>
    <linearGradient id="aceWallPaint" x1="130" y1="258" x2="158" y2="335" gradientUnits="userSpaceOnUse"><stop stop-color="#ef554e"/><stop offset="1" stop-color="#c42f39"/></linearGradient>
    <linearGradient id="aceCapPaint" x1="175" y1="50" x2="208" y2="121" gradientUnits="userSpaceOnUse"><stop stop-color="#89af50"/><stop offset="1" stop-color="#4a752f"/></linearGradient>
    <linearGradient id="aceWhite" x1="217" y1="110" x2="190" y2="222" gradientUnits="userSpaceOnUse"><stop stop-color="#fffef5"/><stop offset="1" stop-color="#e9e7db"/></linearGradient>
    <linearGradient id="aceLens" x1="190" y1="43" x2="210" y2="64" gradientUnits="userSpaceOnUse"><stop stop-color="#d0f7fa"/><stop offset=".55" stop-color="#698f93"/><stop offset="1" stop-color="#263b44"/></linearGradient>
    <radialGradient id="aceOpticalGlass" cx="32%" cy="24%" r="80%"><stop stop-color="#f2ffff" stop-opacity=".95"/><stop offset=".22" stop-color="#a9dce6" stop-opacity=".85"/><stop offset=".54" stop-color="#497e91" stop-opacity=".74"/><stop offset=".83" stop-color="#1b3448" stop-opacity=".94"/><stop offset="1" stop-color="#0d1c2d"/></radialGradient>
