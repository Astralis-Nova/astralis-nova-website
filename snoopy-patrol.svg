              <g class="ace-glass-stars" fill="#fff"><circle cx="182" cy="48" r="1"/><circle cx="212" cy="45" r="1.1"/><circle cx="218" cy="50" r=".6"/></g>
            </g>
            <path d="M169 48c2-6 9-11 14-11m21-4c6-4 15 1 19 7" stroke="#ffedc6" stroke-width="1.4"/>
            <path d="m195 46 5-2" stroke="#5c3e2c" stroke-width="6"/>
            <path d="m195 45 5-2" stroke="#d4ad70" stroke-width="2"/>
            <circle cx="167" cy="59" r="1.2" fill="#f6d6a0" stroke="none"/><circle cx="227" cy="55" r="1.2" fill="#f6d6a0" stroke="none"/>
